load_module /usr/lib/nginx/modules/ngx_http_image_filter_module.so;
worker_processes 2;
pid gallery-nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    server {
        listen unix:http.sock;
        root site;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        location = / { try_files /index.html =404; }
        location = /index.html { }
        location = /catalog.json { }
        location /media/ { }
        location /preview/ {
            alias site/media/;
            image_filter resize 640 640;
            image_filter_buffer 16M;
            image_filter_jpeg_quality 85;
        }
        location / { return 404; }
    }
}
